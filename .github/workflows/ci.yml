name: CI Pipeline

on:
  push:
    branches: [ main, Testting-and-Corrections ]
  pull_request:
    branches: [ main, Testting-and-Corrections ]

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Backend Tests
        run: npm test
        env:
          NODE_ENV: test
          ADMIN_API_KEY: ci-test-key-32-characters-minimum-length
          CASHFREE_SECRET_KEY: test_secret_key_for_ci_pipeline

  frontend-build:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Lint
        run: npm run lint

      - name: Run Frontend Type Check
        run: npx tsc --noEmit

      - name: Run Frontend Production Build
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: https://api.shreeyatours.com
          NEXT_PUBLIC_WHATSAPP_NUMBER: "916353818605"
          NEXT_PUBLIC_CONTACT_EMAIL: "shreeyatours19@gmail.com"
          NEXT_PUBLIC_SITE_PHONE: "+91 98765 43210"
          NEXT_PUBLIC_SITE_EMAIL: "support@shreeyatours.com"
          NEXT_PUBLIC_SITE_OFFICE: "Ahmedabad, Gujarat, India"

